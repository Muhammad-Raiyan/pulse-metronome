name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails only on high/critical advisories; the known low-severity ones (deepmerge via vite-plugin-pwa) are tolerated
      - name: Audit dependencies
        run: npm audit --audit-level=high
